<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">Volunteer Management System Design architecture overview</title><rect width="1440" height="720" rx="22" fill="#0B1220"/><text x="50" y="66" fill="#F3F6FA" font-size="32" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Prototype implementation boundary</text><text x="50" y="106" fill="#A6B6CB" font-size="18" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Two Windows Forms tabs · session-only entries · no database, authentication or payment processing</text><path d="M 50 132 H 1390" fill="none" stroke="#293A50" stroke-width="2.5"/><path d="M 420 235 H 565 M 420 390 H 565 M 720 278 V 347 M 875 390 H 1020" fill="none" stroke="#FF9EBB" stroke-width="2.5"/><rect x="100.0" y="192" width="320" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="120.0" cy="216" r="4" fill="#FF9EBB"/><text x="137.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Volunteer tab</text><text x="120.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Name or alias + interest</text><rect x="100.0" y="347" width="320" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="120.0" cy="371" r="4" fill="#FF9EBB"/><text x="137.0" y="378" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Donation intents tab</text><text x="120.0" y="409" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Category + description</text><rect x="565.0" y="192" width="310" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="585.0" cy="216" r="4" fill="#FF9EBB"/><text x="602.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Required-field checks</text><text x="585.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Reject blank input</text><rect x="565.0" y="347" width="310" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="585.0" cy="371" r="4" fill="#FF9EBB"/><text x="602.0" y="378" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Session entries</text><text x="585.0" y="409" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">BindingList records in memory</text><rect x="1020.0" y="347" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1040.0" cy="371" r="4" fill="#FF9EBB"/><text x="1057.0" y="378" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Read-only grids</text><text x="1040.0" y="409" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Display entries; reset on restart</text><rect x="65" y="535" width="1310" height="110" rx="16" fill="#0B1220" stroke="#293A50"/><text x="90" y="574" fill="#FF9EBB" font-size="16" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">FUTURE DESIGN · NOT IMPLEMENTED</text><text x="90" y="612" fill="#A6B6CB" font-size="22" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Role-based access  /  Opportunity matching  /  Persistence  /  Approvals and audit history</text></svg>
