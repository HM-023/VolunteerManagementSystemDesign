<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">Local architecture for VolunteerManagementSystemDesign</title><rect width="1440" height="720" rx="22" fill="#0B1220"/><text x="50" y="66" fill="#F3F6FA" font-size="34" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Local workspace architecture</text><text x="50" y="108" fill="#A6B6CB" font-size="18" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Persistent community operations app · browser UI + loopback API + local persistence</text><path d="M 50 132 H 1390" fill="none" stroke="#293A50" stroke-width="2.5"/><path d="M 720 278 V 337 M 720 423 V 480 M 540 525 H 390 M 900 525 H 1050" fill="none" stroke="#FF9EBB" stroke-width="2.5"/><rect x="480.0" y="192" width="480" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="500.0" cy="216" r="4" fill="#FF9EBB"/><text x="517.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Browser dashboard</text><text x="500.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Forms · tables · charts · exports</text><rect x="480.0" y="337" width="480" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="500.0" cy="361" r="4" fill="#FF9EBB"/><text x="517.0" y="368" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Loopback API</text><text x="500.0" y="399" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Host + token + origin checks</text><rect x="540.0" y="482" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="560.0" cy="506" r="4" fill="#FF9EBB"/><text x="577.0" y="513" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Domain workflows</text><text x="560.0" y="544" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Validation + executable operations</text><rect x="90.0" y="482" width="300" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="110.0" cy="506" r="4" fill="#FF9EBB"/><text x="127.0" y="513" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Local SQLite state</text><text x="110.0" y="544" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Persistent workspace records</text><rect x="1050.0" y="482" width="300" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1070.0" cy="506" r="4" fill="#FF9EBB"/><text x="1087.0" y="513" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">Downloadable outputs</text><text x="1070.0" y="544" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Reports / designs / snapshots</text><text x="60" y="650" fill="#A6B6CB" font-size="20" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">No external services. Local single-user operation. See the guide for implementation boundaries.</text></svg>
